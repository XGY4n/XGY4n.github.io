<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peeper</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="1; url=/en/peeper/">
<script>
    /* 旧地址兼容壳：/Peeper/ 曾长期对外分发（大小写以旧链接为准，故目录保留
   大写），内容已迁至 /zh/peeper/ 与 /en/peeper/，这里只做语言检测跳转。
   语言入口：手动选过（localStorage "trocar-lang" = zh|en）优先；
       否则看浏览器语言，zh 开头进 /zh/，其余进 /en/。禁用 JS 时由 meta refresh
       落到英文页。各语言页右上角的切换链接会把选择写回这个键。 */
    (function () {
        var l = '';
        try { l = localStorage.getItem('trocar-lang') || ''; } catch (e) { }
        if (l !== 'zh' && l !== 'en') {
            var b = (navigator.languages && navigator.languages[0]) || navigator.language || '';
            l = /^zh/i.test(b) ? 'zh' : 'en';
        }
        location.replace('/' + l + '/peeper/');
    })();
</script>
</head>
<body>
<noscript>
    <a href="/en/peeper/">English</a> / <a href="/zh/peeper/">中文</a>
</noscript>
</body>
</html>
