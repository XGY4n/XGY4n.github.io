<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TROCAR Works</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="1; url=index-en.html">
<script>
    /* 语言入口：上次手动选过的优先；否则按浏览器语言，zh 开头进中文版，其余进英文版。
       拆分页顶部的 EN/中文 按钮会把选择写进 localStorage("trocar-lang")，这里读它。 */
    (function () {
        var l = '';
        try { l = localStorage.getItem('trocar-lang') || ''; } catch (e) { }
        if (l !== 'cn' && l !== 'en') {
            var b = (navigator.languages && navigator.languages[0]) || navigator.language || '';
            l = /^zh/i.test(b) ? 'cn' : 'en';
        }
        location.replace('index-' + l + '.html');
    })();
</script>
</head>
<body>
    <noscript>
        <a href="index-en.html">English</a> / <a href="index-cn.html">中文</a>
    </noscript>
</body>
</html>
